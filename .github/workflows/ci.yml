name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # numpy 2.5 Python >= 3.12 gerektirir (bkz. requirements.txt)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      # Yalnızca birim testleri; Playwright/tarayıcı testleri CI'da çalışmaz.
      - name: pytest
        run: pytest tests/ -v
